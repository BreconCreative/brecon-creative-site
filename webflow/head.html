<script>
// Google Analytics measurement ID. Leave empty until launch: with no ID there is no cookie banner and
// no Analytics. At launch, paste the G- ID from GA4 here. It only loads after a visitor clicks Accept.
window.BC_ANALYTICS_ID = "";
// JS is on: lets CSS hide intro text until its entrance animation plays. If the
// site script never starts, the class is removed so nothing stays hidden.
document.documentElement.classList.add("bc-js");
setTimeout(function () { if (!window.bcSiteReady) document.documentElement.classList.remove("bc-js"); }, 4000);
// First visit intro: cover the page before first paint so the logo animation can play over it.
// Only on a first visit with motion allowed. Add ?intro to any URL to see it again.
// If the site script never starts, the cover lifts.
try {
  var bcIntroAgain = /[?&]intro(=|&|$)/.test(location.search);
  if ((bcIntroAgain || !localStorage.getItem("bc-intro-seen")) && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("bc-intro");
    setTimeout(function () { if (!window.bcIntroStarted) document.documentElement.classList.remove("bc-intro"); }, 4000);
  }
} catch (e) {}
</script>
