<style>
/* Page Sky: the hero background on every page except home. A navy sky, a moving glow in the brand glow colours and the
   ridge lines, the same family as the home hero. Pick the sky with the component variant:
   Afterglow (base, services), First light (About), Beacon (Projects), Signal (Contact), Moonrise (Journal), Quiet (still).
   The site script adds the WebGL glow, the cursor on the ridge and the pause button. It reads the variables below. */
.sky_wrap {
  --aura-h: 100svh; --band-h: clamp(14rem, 30svh, 18rem);
  --warm: 42% 28% at 65% 83%; --rose: 36% 60% at 100% 62%; --plum: 70% 22% at 52% 97%;
  --vio-top: 30% 36% at 88% 34%; --vio-left: 50% 40% at 16% 94%; --mask: 100% 90% at 72% 86%;
  --sky-core: var(--swatch--light-200); --sky-glow: var(--swatch--ember); --sky-hot: var(--swatch--brand-500);
  --sky-cool: var(--swatch--violet); --sky-deep: var(--swatch--deep-blue); --sky-under: var(--swatch--brand-500);
  --sky-intensity: 0.95; }
/* Room under the hero content, so the ridge and the glow sit below the words */
:has(> .sky_wrap) > .u-container { padding-bottom: 7rem; }
:has(> .sky_wrap.w-variant-880512dd-67f3-65b5-330d-e8f58bb4896d) > .u-container { padding-bottom: 0; }
:has(> .sky_wrap.w-variant-a027ad85-0439-806f-985a-f117331553f7) > .u-container { padding-bottom: 3rem; }
.sky_aura { position: absolute; left: 0; right: 0; bottom: 0; height: var(--aura-h); -webkit-mask-image: radial-gradient(var(--mask), #000 42%, transparent 82%); mask-image: radial-gradient(var(--mask), #000 42%, transparent 82%); }
.sky_aura.is-warm { background-image: radial-gradient(var(--warm), var(--sky-core) 0%, var(--sky-glow) 9%, color-mix(in srgb, var(--sky-glow) 40%, var(--sky-hot)) 20%, var(--sky-hot) 34%, color-mix(in srgb, var(--sky-hot) 60%, transparent) 52%, transparent 74%), radial-gradient(var(--rose), color-mix(in srgb, var(--sky-cool) 80%, transparent) 0%, color-mix(in srgb, color-mix(in srgb, var(--sky-cool) 50%, var(--sky-deep)) 60%, transparent) 40%, transparent 76%), radial-gradient(var(--plum), color-mix(in srgb, var(--sky-under) 45%, transparent) 0%, transparent 75%); }
.sky_aura.is-cool { background-image: radial-gradient(var(--vio-top), color-mix(in srgb, var(--sky-cool) 55%, transparent) 0%, transparent 72%), radial-gradient(var(--vio-left), color-mix(in srgb, var(--sky-deep) 90%, transparent) 0%, color-mix(in srgb, color-mix(in srgb, var(--sky-cool) 30%, var(--sky-deep)) 60%, transparent) 50%, transparent 78%); }
/* Navy at the very bottom, so the hero settles into the next section with no edge */
.sky_floor { position: absolute; left: 0; right: 0; bottom: 0; height: 6rem; background-image: linear-gradient(to top, var(--swatch--dark-900), transparent); }
.sky_lines { position: absolute; left: 0; bottom: 0; width: 100%; max-width: none; height: var(--band-h); -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%); mask-image: linear-gradient(to bottom, #000 78%, transparent 100%); }
.sky_stop.is-1 { stop-color: var(--sky-line-1, var(--swatch--light-200)); stop-opacity: 0.55; }
.sky_stop.is-2 { stop-color: var(--sky-line-2, var(--swatch--light-200)); }
.sky_stop.is-3 { stop-color: var(--sky-line-3, var(--swatch--brand-500)); }
.sky_stop.is-ridge-top { stop-color: var(--swatch--dark-900); stop-opacity: 0.2; }
.sky_stop.is-ridge-mid { stop-color: var(--swatch--dark-900); stop-opacity: 0.75; }
.sky_stop.is-ridge-bottom { stop-color: var(--swatch--dark-900); stop-opacity: 1; }
.sky_ridge { fill: url(#sky-ridge); }
.sky_line { --o: 1; fill: none; stroke: url(#sky-line); stroke-width: 1.3; opacity: var(--o); }
.sky_line.is-glow { --o: 0.7; stroke-width: 7; filter: url(#sky-blur); }
.sky_line.is-1 { --o: 0.95; } .sky_line.is-2 { --o: 0.62; } .sky_line.is-3 { --o: 0.48; }
.sky_line.is-4 { --o: 0.37; } .sky_line.is-5 { --o: 0.27; } .sky_line.is-6 { --o: 0.19; }
.sky_spark { fill: none; stroke: var(--swatch--light-200); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 70 1930; stroke-dashoffset: 70; opacity: 0; filter: url(#sky-spark-glow); }
.sky_grain { position: absolute; inset: 0; background-image: var(--grain); opacity: 0.6; mix-blend-mode: overlay; }

/* First light (About): a smaller, softer Ember sun with more deep blue around it */
.sky_wrap.w-variant-96698328-a722-7454-e002-ead938794970 { --warm: 24% 24% at 74% 82%; --vio-left: 70% 44% at 25% 96%; --sky-hot: var(--swatch--ember); --sky-glow: color-mix(in srgb, var(--swatch--ember) 50%, var(--swatch--light-200)); --sky-under: var(--swatch--ember); --sky-intensity: 0.85; }
/* Beacon (Projects): the boldest sun */
.sky_wrap.w-variant-86c86cb4-a37c-44d6-64c9-2699bcf9a8f5 { --warm: 34% 38% at 72% 82%; --plum: 80% 26% at 55% 98%; --vio-top: 26% 34% at 94% 36%; --sky-intensity: 1; }
/* Signal (Contact): a warm glow rising behind the brief */
.sky_wrap.w-variant-880512dd-67f3-65b5-330d-e8f58bb4896d { --warm: 30% 36% at 78% 80%; --rose: 30% 50% at 100% 44%; --vio-left: 60% 36% at 15% 96%; --mask: 110% 90% at 74% 84%; --sky-intensity: 1; }
/* Moonrise (Journal): a Linen moon in a Violet and deep blue sky, with a faint Ember glow under the ridge */
.sky_wrap.w-variant-264a59e9-5ddd-b1d4-9e0e-a470aa516a35 { --warm: 24% 28% at 74% 80%; --rose: 40% 56% at 100% 60%; --vio-top: 40% 44% at 72% 50%; --vio-left: 70% 40% at 20% 96%; --plum: 70% 18% at 40% 98%;
  --sky-glow: color-mix(in srgb, var(--swatch--violet) 45%, var(--swatch--light-200)); --sky-hot: var(--swatch--violet); --sky-cool: var(--swatch--deep-blue); --sky-under: var(--swatch--ember);
  --sky-line-3: var(--swatch--light-200); --sky-intensity: 0.95; }
/* Quiet (legal pages and 404): a dim afterglow that stays still */
.sky_wrap.w-variant-a027ad85-0439-806f-985a-f117331553f7 { --sky-static: 1; }
.sky_wrap.w-variant-a027ad85-0439-806f-985a-f117331553f7 .sky_aura { opacity: 0.6; }
.sky_wrap.w-variant-a027ad85-0439-806f-985a-f117331553f7 .sky_spark { display: none; }

@media (max-width: 991px) {
.sky_wrap { --band-h: 14rem; }
.sky_lines { left: -30%; width: 130%; }
}
@media (max-width: 767px) {
.sky_wrap { --band-h: 12rem; --aura-h: 92svh; --warm: 60% 20% at 64% 84%; --rose: 46% 32% at 106% 74%; --vio-top: 44% 40% at 108% 38%; --vio-left: 80% 22% at 4% 94%; --plum: 90% 16% at 50% 97%; --mask: 140% 80% at 70% 90%; }
:has(> .sky_wrap) > .u-container { padding-bottom: 8rem; }
:has(> .sky_wrap.w-variant-880512dd-67f3-65b5-330d-e8f58bb4896d) > .u-container { padding-bottom: 6rem; }
:has(> .sky_wrap.w-variant-a027ad85-0439-806f-985a-f117331553f7) > .u-container { padding-bottom: 4rem; }
.sky_lines { left: -62%; width: 164%; }
.sky_wrap.w-variant-96698328-a722-7454-e002-ead938794970 { --warm: 40% 15% at 70% 84%; }
.sky_wrap.w-variant-86c86cb4-a37c-44d6-64c9-2699bcf9a8f5 { --warm: 64% 22% at 64% 86%; }
.sky_wrap.w-variant-880512dd-67f3-65b5-330d-e8f58bb4896d { --warm: 60% 20% at 70% 86%; }
.sky_wrap.w-variant-264a59e9-5ddd-b1d4-9e0e-a470aa516a35 { --warm: 44% 16% at 70% 84%; }
}
/* Motion keeps the home hero's timings. Transform and opacity only. It pauses off screen and with the pause button */
@media (prefers-reduced-motion: no-preference) {
.sky_aura.is-warm { transform-origin: 70% 85%; animation: sky-sun 9s ease-in-out infinite alternate; }
.sky_aura.is-cool { transform-origin: 30% 90%; animation: sky-drift 13s ease-in-out infinite alternate; }
.sky_lines { animation: sky-lines 11s ease-in-out infinite alternate; }
.sky_line { animation: sky-breathe 6s ease-in-out infinite alternate; }
.sky_line.is-glow, .sky_line.is-1 { animation-duration: 7s; }
.sky_line.is-2 { animation-duration: 5s; animation-delay: -2s; }
.sky_line.is-3 { animation-duration: 8s; animation-delay: -5s; }
.sky_line.is-4 { animation-duration: 6s; animation-delay: -1s; }
.sky_line.is-5 { animation-duration: 9s; animation-delay: -4s; }
.sky_line.is-6 { animation-duration: 7s; animation-delay: -6s; }
.sky_spark { animation: sky-spark 7s cubic-bezier(.45,0,.25,1) infinite; }
.sky_spark.is-2 { animation-duration: 9s; animation-delay: -3.5s; }
.sky_spark.is-3 { animation-duration: 11s; animation-delay: -7s; }
:is(.is-offscreen, .is-paused) > .sky_wrap :is(.sky_aura, .sky_lines, .sky_line, .sky_spark) { animation-play-state: paused; }
.sky_wrap.w-variant-a027ad85-0439-806f-985a-f117331553f7 :is(.sky_aura, .sky_lines, .sky_line, .sky_spark) { animation: none; }
@keyframes sky-sun { from { transform: translate3d(0, 2%, 0) scale(1); opacity: 0.8; } to { transform: translate3d(0, -2%, 0) scale(1.08); opacity: 1; } }
@keyframes sky-drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(0, -3%, 0) scale(1.12); } }
@keyframes sky-lines { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, 0.75rem, 0); } }
@keyframes sky-breathe { from { opacity: calc(var(--o) * 0.3); } to { opacity: min(1, calc(var(--o) * 1.6)); } }
@keyframes sky-spark { 0% { stroke-dashoffset: 70; opacity: 0; } 8% { opacity: 1; } 60% { opacity: 1; } 68% { stroke-dashoffset: -1000; opacity: 0; } 100% { stroke-dashoffset: -1000; opacity: 0; } }
}
